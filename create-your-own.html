<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gabe's Turing Machine Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Gabe's Turing Machine Designer</h1>

  <div class="tape" id="tapeDisplay"></div>
  <p style="margin: 5px 0;">Current State: <strong id="currentState">—</strong></p>

  <div class="controls" style="margin: 5px 0;">
    <button onclick="step()">Step</button>
    <button onclick="run()">Run</button>
    <button onclick="pause()">Pause</button>
    <button onclick="reset()">Reset</button>
    <button onclick="addCell()">Add Cell</button>
    <button onclick="clearTransitions()">Clear Transitions</button>
    <select id="exampleSelector" onchange="loadExample(this.value)">
      <option value="">Load Example...</option>
      <option value="flip">Flip Bits</option>
      <option value="parity">Even Parity Checker</option>
      <option value="mirror">Mirror Tape (WIP DOES NOT WORK)</option>
    </select>
  </div>

 <div class="grid" style="margin-top: 10px;">
    <div>
      <h2>Add Transition</h2>
      <form id="transitionForm" style="margin-top: 5px;">
        <label style="margin: 2px 0; display: block;">Current State: <input id="currentStateInput" required></label>
        <label style="margin: 2px 0; display: block;">Read Symbol: <input id="readSymbolInput" maxlength="1" required></label>
        <label style="margin: 2px 0; display: block;">Write Symbol: <input id="writeSymbolInput" maxlength="1" required></label>
        <label style="margin: 2px 0; display: block;">Move:
          <select id="directionInput">
            <option value="R">Right</option>
            <option value="L">Left</option>
          </select>
        </label>
        <label style="margin: 2px 0; display: block;">Next State: <input id="nextStateInput" required></label>
        <button type="submit" style="margin-top: 5px;">Add Transition</button>
      </form>
    </div>
    <div class="transitions">
      <h2>Transition Table</h2>
      <table id="transitionTable">
        <tr><th>Key</th><th>Write</th><th>Move</th><th>Next</th></tr>
      </table>
    </div>
  </div>

  <script>
    let tape = ['_', '_', '_', '_', '_'];
    let head = 2;
    let state = 'q0';
    let transitions = {};
    let intervalId = null;

    const examples = {
      flip: {
        tape: ['1', '0', '1', '1', '0'],
        head: 0,
        state: 'q0',
        transitions: {
          'q0_1': ['q0', '0', 'R'],
          'q0_0': ['q0', '1', 'R'],
          'q0__': ['halt', '_', 'R']
        }
      },
      parity: {
        tape: ['1', '0', '1', '1'],
        head: 0,
        state: 'q0',
        transitions: {
          'q0_1': ['q1', '1', 'R'],
          'q0_0': ['q0', '0', 'R'],
          'q0__': ['even', '_', 'R'],
          'q1_1': ['q0', '1', 'R'],
          'q1_0': ['q1', '0', 'R'],
          'q1__': ['odd', '_', 'R']
        }
      },
      mirror :{
        tape: ['1', '0', '1'],   // example input w = 101  → output 101101
        head: 0,
        state: 'q0',
        transitions: {
          'q0_1': ['qFindR1', 'X', 'R'],  // mark left '1', go find matching rightmost
    'q0_0': ['qFindR0', 'Y', 'R'],  // mark left '0'
    'q0_X': ['q0', 'X', 'R'],       // skip marked
    'q0_Y': ['q0', 'Y', 'R'],
    'q0__': ['halt', '_', 'R'],     // done, all mirrored

    // qFindR1: run right until blank or marked, then backtrack
    'qFindR1_0': ['qFindR1', '0', 'R'],
    'qFindR1_1': ['qFindR1', '1', 'R'],
    'qFindR1_X': ['qFindR1', 'X', 'R'],
    'qFindR1_Y': ['qFindR1', 'Y', 'R'],
    'qFindR1__': ['qSwap1', '_', 'L'],  // at right end, go back to swap

    // qFindR0 is symmetric
    'qFindR0_0': ['qFindR0', '0', 'R'],
    'qFindR0_1': ['qFindR0', '1', 'R'],
    'qFindR0_X': ['qFindR0', 'X', 'R'],
    'qFindR0_Y': ['qFindR0', 'Y', 'R'],
    'qFindR0__': ['qSwap0', '_', 'L'],

    // qSwap1: walk left until unmarked, replace, then restore left side
    'qSwap1_0': ['qSwap1', '0', 'L'],
    'qSwap1_1': ['qSwap1', '1', 'L'],
    'qSwap1_X': ['qReturn1', '1', 'L'],  // swap the rightmost with '1'
    'qSwap1_Y': ['qReturn1', '0', 'L'],  // if it was a '0', swap properly

    // qSwap0: similar but expecting to put '0' at right
    'qSwap0_0': ['qSwap0', '0', 'L'],
    'qSwap0_1': ['qSwap0', '1', 'L'],
    'qSwap0_X': ['qReturn0', '1', 'L'],
    'qSwap0_Y': ['qReturn0', '0', 'L'],

    // qReturn*: go back left to restart scanning
    'qReturn1_0': ['qReturn1', '0', 'L'],
    'qReturn1_1': ['qReturn1', '1', 'L'],
    'qReturn1_X': ['q0', '1', 'R'],   // restored left, resume
    'qReturn1_Y': ['q0', '0', 'R'],

    'qReturn0_0': ['qReturn0', '0', 'L'],
    'qReturn0_1': ['qReturn0', '1', 'L'],
    'qReturn0_X': ['q0', '1', 'R'],
    'qReturn0_Y': ['q0', '0', 'R'],
        }
      }
};

    function renderTape() {
      const container = document.getElementById("tapeDisplay");
      container.innerHTML = "";
      tape.forEach((symbol, i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = symbol;
        if (i === head) cell.classList.add("head");
        cell.contentEditable = true;
        cell.addEventListener("blur", () => {
            const newSymbol = cell.textContent.trim();
            tape[i] = newSymbol[0] || '_';
            renderTape();
        });
        container.appendChild(cell);
      });
      document.getElementById("currentState").textContent = state;
    }

    function step() {
      if (state === "halt") return pause();

      const symbol = tape[head] || '_';
      const key = `${state}_${symbol}`;
      const rule = transitions[key];
      if (!rule) return pause();

      const [newState, write, move] = rule;
      tape[head] = write;
      head += move === "R" ? 1 : -1;

      if (head < 0) {
        tape.unshift('_');
        head = 0;
      } else if (head >= tape.length) {
        tape.push('_');
      }

      state = newState;
      renderTape();
    }

    function run() {
      if (!intervalId) intervalId = setInterval(step, 500);
    }

    function pause() {
      clearInterval(intervalId);
      intervalId = null;
    }

    function reset() {
      pause();
      tape = ['_', '_', '_', '_', '_'];
      head = 2;
      state = 'q0';
      renderTape();
    }

    function addCell() {
      tape.push('_');
      renderTape();
    }

    function clearTransitions() {
      transitions = {};
      const table = document.getElementById("transitionTable");
      table.innerHTML = '<tr><th>Key</th><th>Write</th><th>Move</th><th>Next</th></tr>';
    }

    function loadExample(exampleKey) {
      if (!examples[exampleKey]) return;
      const example = examples[exampleKey];
      pause();
      tape = [...example.tape];
      head = example.head;
      state = example.state;
      clearTransitions();
      transitions = { ...example.transitions };
      for (const [key, [ns, ws, dir]] of Object.entries(transitions)) {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${key}</td><td>${ws}</td><td>${dir}</td><td>${ns}</td>`;
        document.getElementById("transitionTable").appendChild(row);
      }
      renderTape();
    }

    document.getElementById("transitionForm").addEventListener("submit", e => {
      e.preventDefault();
      const cs = document.getElementById("currentStateInput").value.trim();
      const rs = document.getElementById("readSymbolInput").value.trim();
      const ws = document.getElementById("writeSymbolInput").value.trim();
      const dir = document.getElementById("directionInput").value;
      const ns = document.getElementById("nextStateInput").value.trim();

      const key = `${cs}_${rs}`;
      transitions[key] = [ns, ws, dir];

      const row = document.createElement("tr");
      row.innerHTML = `<td>${key}</td><td>${ws}</td><td>${dir}</td><td>${ns}</td>`;
      document.getElementById("transitionTable").appendChild(row);

      e.target.reset();
    });

    renderTape();
  </script>
</body>
</html>
